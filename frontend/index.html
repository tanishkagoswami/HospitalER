<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HospitalER System</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 650px;
        }
        h1 { 
            font-size: 22px; 
            margin-top: 0; 
            color: #2c3e50; 
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }
        #terminal {
            background: #fafafa;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 20px;
            color: #4a5568;
        }
        .input-group { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: #4299e1; }
        button {
            padding: 12px 24px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover { background: #3182ce; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HospitalER</h1>
        <div id="terminal"></div>
        <div class="input-group">
            <input type="text" id="cmdInput" placeholder="Type an option (e.g., 1) and press Enter..." autocomplete="off" autofocus>
            <button onclick="sendCommand()">Send</button>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('cmdInput');
        
        const ws = new WebSocket('ws://localhost:8080/');

        ws.onopen = () => {
            terminal.textContent += "--- Connected to HospitalER ---\n\n";
        };

        ws.onmessage = function(event) {
            terminal.textContent += event.data;
            terminal.scrollTop = terminal.scrollHeight;
        };

        ws.onclose = () => {
            terminal.textContent += "\n\n--- Disconnected ---";
        };

        function sendCommand() {
            const val = input.value;
            if (val.trim() !== '') {
                ws.send(val + '\n');
                terminal.textContent += val + '\n';
                input.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        }

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendCommand();
        });
    </script>
</body>
</html>
